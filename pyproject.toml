[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "il-ha"
version = "0.0.1.dev0"
description = "Home Assistant integration that turns IL descriptors into entities"
requires-python = ">=3.13"
license = "MIT"
dependencies = []   # `custom_components.il_ha.core` needs nothing; the Home Assistant layer needs Home Assistant


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

# The same tree Home Assistant loads (custom_components/il_ha), installable so a host outside Home Assistant can use `core`.
[tool.hatch.build.targets.wheel]
packages = ["custom_components/il_ha"]
