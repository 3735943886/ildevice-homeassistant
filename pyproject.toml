[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "il-ha"
version = "0.0.1"
description = "Home Assistant integration that turns IL descriptors into entities"
requires-python = ">=3.14"
license = "MIT"
dependencies = []   # `custom_components.ildevice.core` needs nothing; the Home Assistant layer needs Home Assistant

[project.optional-dependencies]
# Pinned: unpinned, pip silently falls back to whatever release matches the resolver's
# Python, which can be a much older Home Assistant with a different registry API (seen in
# CI: py3.13 resolved to HA 2026.2.3 instead of this pin's 2026.9.3, and tests failed on
# API differences that had nothing to do with the change being tested).
test = ["pytest-homeassistant-custom-component==0.13.366"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

# The same tree Home Assistant loads (custom_components/ildevice), installable so a host outside Home Assistant can use `core`.
[tool.hatch.build.targets.wheel]
packages = ["custom_components/ildevice"]
