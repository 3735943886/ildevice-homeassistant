name: Release

# A pushed tag `v<version>` (e.g. v0.0.1) is the release trigger: tests run first, the tag is
# checked against manifest.json so a stray tag can't ship the wrong version, the
# `ildevice-homeassistant` package goes to PyPI (the manifest requires it, so it must exist before
# HACS sees the release), and only then is the GitHub release made, with the integration folder
# attached as a zip for a manual install. PyPI publishing is trusted publishing from the `pypi`
# environment.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: 3735943886/ildevice
          ref: bc51a9ef8ac46770f67a02722c5c92907d1019ee # ildevice v0.1.0
          path: .ildevice-spec
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install .[test]
      - run: python -m pytest
        env:
          ILDEVICE: ${{ github.workspace }}/.ildevice-spec

  pypi:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # tests/test_package.py keeps pyproject.toml and the manifest's requirement at this version.
      - name: Check the tag matches manifest.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(python3 -c 'import json; print(json.load(open("custom_components/ildevice/manifest.json"))["version"])')"
          if [ "$tag" != "$manifest" ]; then
            echo "tag v$tag does not match manifest.json version $manifest" >&2
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Zip the integration
        run: |
          cd custom_components
          zip -r "$GITHUB_WORKSPACE/ildevice.zip" ildevice -x "*/__pycache__/*" "*.pyc"

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: ildevice.zip
